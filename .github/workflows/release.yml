name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.2.0)'
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Write encrypted env
        run: echo "${{ secrets.ENV_ENCRYPTED }}" > .env.encrypted

      - name: Build Tauri (Linux)
        run: npx tauri build --bundles deb appimage

      - name: Rename artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          cp src-tauri/target/release/bundle/deb/*.deb "release/FlowFolio-${VERSION}-linux-amd64.deb" 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage "release/FlowFolio-${VERSION}-linux-amd64.AppImage" 2>/dev/null || true
          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/FlowFolio-*
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Write encrypted env
        shell: bash
        run: echo "${{ secrets.ENV_ENCRYPTED }}" > .env.encrypted

      - name: Build Tauri (Windows)
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npx tauri build --bundles nsis msi

      - name: Rename artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          cp src-tauri/target/release/bundle/nsis/*.exe "release/FlowFolio-${VERSION}-windows-x64-setup.exe" 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi "release/FlowFolio-${VERSION}-windows-x64.msi" 2>/dev/null || true
          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/FlowFolio-*
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Write encrypted env
        run: echo "${{ secrets.ENV_ENCRYPTED }}" > .env.encrypted

      - name: Build Tauri (macOS)
        run: npx tauri build --bundles dmg --target ${{ matrix.target }}

      - name: Rename artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then ARCH="aarch64"; else ARCH="x64"; fi
          mkdir -p release
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "release/FlowFolio-${VERSION}-macos-${ARCH}.dmg" 2>/dev/null || true
          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.target }}
          path: release/FlowFolio-*
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Install frontend dependencies
        run: npm ci

      - name: Write encrypted env
        run: echo "${{ secrets.ENV_ENCRYPTED }}" > .env.encrypted

      - name: Initialize Tauri Android
        run: npx tauri android init

      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npx tauri android build --apk true

      - name: Rename artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          find src-tauri/gen/android -name "*.apk" -path "*/release/*" | while read apk; do
            cp "$apk" "release/FlowFolio-${VERSION}-android.apk"
            break
          done
          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/FlowFolio-*
          retention-days: 30

  create-release:
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v') && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-android.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          cp artifacts/**/* release/ 2>/dev/null || true
          cd release && shasum -a 256 FlowFolio-* > checksums-sha256.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FlowFolio ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
