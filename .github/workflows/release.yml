name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.2.0)'
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run lint
      - run: npm run test:coverage
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - run: cd src-tauri && cargo fmt --check
      - run: cd src-tauri && cargo clippy -- -D warnings
      - run: cd src-tauri && cargo test

  build-linux:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Write encrypted env
        run: echo "${{ secrets.ENV_ENCRYPTED }}" > .env.encrypted

      - name: Build Tauri (Linux)
        run: npx tauri build --bundles deb appimage

      - name: Rename artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          cp src-tauri/target/release/bundle/deb/*.deb "release/FlowFolio-${VERSION}-linux-amd64.deb" 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage "release/FlowFolio-${VERSION}-linux-amd64.AppImage" 2>/dev/null || true
          ls -lh release/

      - name: Verify artifacts present and non-trivial
        run: |
          set -e
          for f in release/FlowFolio-*-linux-amd64.deb release/FlowFolio-*-linux-amd64.AppImage; do
            [ -s "$f" ] || { echo "::error::missing or empty: $f"; exit 1; }
            mb=$(( $(stat -c%s "$f") / 1024 / 1024 ))
            echo "$f: ${mb}MB"
            [ "$mb" -ge 5 ] || { echo "::error::$f suspiciously small (${mb}MB < 5MB)"; exit 1; }
          done

      - name: Smoke-test AppImage (xvfb)
        run: |
          set -e
          sudo apt-get install -y xvfb libfuse2
          APP=$(ls release/FlowFolio-*-linux-amd64.AppImage)
          chmod +x "$APP"
          xvfb-run -a --server-args="-screen 0 1280x800x24" "$APP" > /tmp/appimage.log 2>&1 &
          APP_PID=$!
          sleep 10
          if kill -0 $APP_PID 2>/dev/null; then
            echo "✓ AppImage stayed alive 10s; last log lines:"
            tail -20 /tmp/appimage.log || true
            kill -TERM $APP_PID 2>/dev/null || true
            sleep 2
            pkill -9 -f FlowFolio 2>/dev/null || true
          else
            echo "::error::AppImage exited during startup"
            tail -50 /tmp/appimage.log || true
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/FlowFolio-*
          retention-days: 30

  build-windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Write encrypted env
        shell: bash
        run: echo "${{ secrets.ENV_ENCRYPTED }}" > .env.encrypted

      - name: Build Tauri (Windows)
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npx tauri build --bundles nsis msi

      - name: Rename artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          cp src-tauri/target/release/bundle/nsis/*.exe "release/FlowFolio-${VERSION}-windows-x64-setup.exe" 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi "release/FlowFolio-${VERSION}-windows-x64.msi" 2>/dev/null || true
          ls -lh release/

      - name: Verify artifacts present and non-trivial
        shell: bash
        run: |
          set -e
          for f in release/FlowFolio-*-windows-x64-setup.exe release/FlowFolio-*-windows-x64.msi; do
            [ -s "$f" ] || { echo "::error::missing or empty: $f"; exit 1; }
            size=$(stat -c%s "$f" 2>/dev/null || wc -c < "$f")
            mb=$(( size / 1024 / 1024 ))
            echo "$f: ${mb}MB"
            [ "$mb" -ge 5 ] || { echo "::error::$f suspiciously small (${mb}MB < 5MB)"; exit 1; }
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/FlowFolio-*
          retention-days: 30

  build-macos:
    needs: preflight
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Write encrypted env
        run: echo "${{ secrets.ENV_ENCRYPTED }}" > .env.encrypted

      - name: Build Tauri (macOS)
        run: npx tauri build --bundles dmg --target ${{ matrix.target }}

      - name: Rename artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then ARCH="aarch64"; else ARCH="x64"; fi
          mkdir -p release
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "release/FlowFolio-${VERSION}-macos-${ARCH}.dmg" 2>/dev/null || true
          ls -lh release/

      - name: Verify artifact present and non-trivial
        run: |
          set -e
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then ARCH="aarch64"; else ARCH="x64"; fi
          DMG=$(ls release/FlowFolio-*-macos-${ARCH}.dmg)
          [ -s "$DMG" ] || { echo "::error::missing or empty: $DMG"; exit 1; }
          mb=$(( $(stat -f%z "$DMG") / 1024 / 1024 ))
          echo "$DMG: ${mb}MB"
          [ "$mb" -ge 5 ] || { echo "::error::$DMG suspiciously small (${mb}MB < 5MB)"; exit 1; }
          # Verify DMG can be mounted (catches corrupt bundles)
          MOUNT_DIR=$(hdiutil attach "$DMG" -nobrowse -noverify -mountpoint "/tmp/fl-${ARCH}" | tail -1 | awk '{print $NF}')
          ls "$MOUNT_DIR"/*.app >/dev/null || { echo "::error::no .app inside DMG"; hdiutil detach "$MOUNT_DIR" -force; exit 1; }
          hdiutil detach "$MOUNT_DIR" -force
          echo "✓ DMG mounts cleanly and contains .app bundle"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.target }}
          path: release/FlowFolio-*
          retention-days: 30

  build-android:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Write encrypted env
        run: echo "${{ secrets.ENV_ENCRYPTED }}" > .env.encrypted

      - name: Initialize Tauri Android
        run: |
          if [ ! -f src-tauri/gen/android/build.gradle.kts ]; then
            npx tauri android init
          fi

      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npx tauri android build --target aarch64

      - name: Rename artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          find src-tauri/gen/android -name "*.apk" -path "*/release/*" | while read apk; do
            cp "$apk" "release/FlowFolio-${VERSION}-android.apk"
            break
          done
          ls -lh release/

      - name: Verify APK present and inspect manifest
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          set -e
          APK=$(ls release/FlowFolio-*-android.apk)
          [ -s "$APK" ] || { echo "::error::missing or empty: $APK"; exit 1; }
          mb=$(( $(stat -c%s "$APK") / 1024 / 1024 ))
          echo "$APK: ${mb}MB"
          [ "$mb" -ge 10 ] || { echo "::error::APK suspiciously small (${mb}MB < 10MB)"; exit 1; }
          # aapt2 ships with build-tools (added to PATH by setup-android)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          echo "Using $AAPT"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | head -15
          PKG=$(echo "$BADGING" | grep -oE "package: name='[^']+" | head -1 | cut -d"'" -f2)
          VER=$(echo "$BADGING" | grep -oE "versionName='[^']+" | head -1 | cut -d"'" -f2)
          [ -n "$PKG" ] || { echo "::error::APK has no package name"; exit 1; }
          [ -n "$VER" ] || { echo "::error::APK has no versionName"; exit 1; }
          echo "✓ Android APK validated: $PKG @ $VER"
          # Cross-check version matches tag (strip leading v)
          TAG_VER="${EXPECTED_VERSION#v}"
          if [ -n "$TAG_VER" ] && [ "$VER" != "$TAG_VER" ]; then
            echo "::warning::APK versionName ($VER) != git tag ($TAG_VER)"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/FlowFolio-*
          retention-days: 30

  create-release:
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    # Require ALL platform builds to succeed before publishing the release.
    # Previously this used `||` which would publish a partial release if any
    # single platform failed — now a single platform failure blocks publish.
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.build-android.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          cp artifacts/**/* release/ 2>/dev/null || true
          cd release && shasum -a 256 FlowFolio-* > checksums-sha256.txt
          ls -lh

      - name: Verify all 7 platform artifacts present
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          set -e
          cd release
          VERSION="${EXPECTED_VERSION#v}"
          MISSING=()
          for suffix in linux-amd64.deb linux-amd64.AppImage \
                        windows-x64-setup.exe windows-x64.msi \
                        macos-aarch64.dmg macos-x64.dmg \
                        android.apk; do
            f="FlowFolio-${VERSION}-${suffix}"
            if [ ! -s "$f" ]; then
              MISSING+=("$f")
            else
              mb=$(( $(stat -c%s "$f") / 1024 / 1024 ))
              echo "✓ $f (${mb}MB)"
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing artifacts: ${MISSING[*]}"
            exit 1
          fi
          echo "✓ All 7 platform artifacts present"

      - name: Re-verify checksums (catches corruption on download/upload roundtrip)
        run: |
          cd release
          shasum -a 256 -c checksums-sha256.txt
          echo "✓ All SHA-256 checksums match"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FlowFolio ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
