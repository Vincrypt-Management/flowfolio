[package]
name = "flowfolio"
version = "0.4.5"
description = "FlowFolio - AI-Powered Vibe-Based Investing"
authors = ["evintleovonzko"]
edition = "2021"
license = "MIT"
default-run = "flowfolio"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flowfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "flowfolio"
path = "src/main.rs"

[[bin]]
name = "encrypt-env"
path = "src/bin/encrypt_env.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-stronghold = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono", "migrate"], default-features = false }
tokio = { version = "1.48.0", features = ["full"] }
anyhow = "1.0.100"
thiserror = "2.0.17"
chrono = { version = "0.4.42", features = ["serde"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream"] }
governor = "0.10.4"
nonzero_ext = "0.3.0"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
dotenvy = "0.15"

# Industrial-Grade Performance Optimizations
moka = { version = "0.12", features = ["future"] }      # High-performance concurrent cache
dashmap = "6.0"                                          # Lock-free concurrent HashMap
rayon = "1.10"                                           # Data parallelism for CPU-bound tasks
futures = "0.3"                                          # Async utilities
async-trait = "0.1"                                      # Async traits
parking_lot = "0.12"                                     # Fast synchronization primitives
tracing = "0.1"                                          # Structured logging for observability
tracing-subscriber = { version = "0.3", features = ["env-filter"] }  # Log filtering
once_cell = "1.20"                                       # Thread-safe lazy initialization
regex = "1.11"                                           # Regex engine for input validation

# Local LLM inference — native llama.cpp bindings (no Ollama required)

# Encryption for secure env storage in release builds (obfuscation-grade, machine-derived key)
aes-gcm = "0.10"                                         # AES-256-GCM encryption with random nonces
base64 = "0.22"                                          # Base64 encoding
whoami = "1.5"                                           # Machine identity for key derivation

# Mobile platform support

# Apple Silicon (ARM64) and iOS: Metal GPU — Metal shaders are arm64-only, x86_64 macOS gets CPU
[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), target_os = "ios"))'.dependencies]
llama_cpp = { version = "0.3", features = ["metal"] }

# x86_64 macOS, Linux, Windows: CPU-only inference (Android excluded entirely)
[target.'cfg(not(any(all(target_os = "macos", target_arch = "aarch64"), target_os = "ios", target_os = "android")))'.dependencies]
llama_cpp = { version = "0.3" }

[target.'cfg(target_os = "android")'.dependencies]
# Android-specific dependencies if needed

[target.'cfg(target_os = "ios")'.dependencies]
# iOS-specific dependencies if needed

[profile.release]
lto = true              # Full link-time optimization — biggest size reduction
codegen-units = 1        # Single codegen unit for maximum optimization
strip = true             # Strip debug symbols from binary
opt-level = 3            # Optimize for speed (desktop app, not size-constrained)
panic = "abort"          # Remove unwinding machinery
