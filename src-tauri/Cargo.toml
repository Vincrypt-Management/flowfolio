[package]
name = "flowfolio"
version = "0.2.2"
description = "FlowFolio - AI-Powered Vibe-Based Investing"
authors = ["evintleovonzko"]
edition = "2021"
default-run = "flowfolio"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flowfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "flowfolio"
path = "src/main.rs"

[[bin]]
name = "encrypt-env"
path = "src/bin/encrypt_env.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-stronghold = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono", "migrate"], default-features = false }
tokio = { version = "1.48.0", features = ["full"] }
anyhow = "1.0.100"
thiserror = "2.0.17"
chrono = { version = "0.4.42", features = ["serde"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
governor = "0.10.4"
nonzero_ext = "0.3.0"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
dotenvy = "0.15"

# Industrial-Grade Performance Optimizations
moka = { version = "0.12", features = ["future"] }      # High-performance concurrent cache
dashmap = "6.0"                                          # Lock-free concurrent HashMap
rayon = "1.10"                                           # Data parallelism for CPU-bound tasks
futures = "0.3"                                          # Async utilities
async-trait = "0.1"                                      # Async traits
parking_lot = "0.12"                                     # Fast synchronization primitives
lazy_static = "1.4"                                      # Lazy static initialization
tracing = "0.1"                                          # Structured logging for observability
tracing-subscriber = { version = "0.3", features = ["env-filter"] }  # Log filtering
backoff = { version = "0.4", features = ["tokio"] }     # Exponential backoff for retries
metrics = "0.24"                                         # Performance metrics collection
once_cell = "1.20"                                       # Thread-safe lazy initialization
arc-swap = "1.7"                                         # Lock-free Arc swapping

# Encryption for secure env storage in release builds (dual-layer 512-bit equivalent)
aes-gcm = "0.10"                                         # AES-256-GCM encryption (layer 1)
chacha20poly1305 = "0.10"                                # ChaCha20-Poly1305 encryption (layer 2)
base64 = "0.22"                                          # Base64 encoding

# Mobile platform support
[target.'cfg(target_os = "android")'.dependencies]
# Android-specific dependencies if needed

[target.'cfg(target_os = "ios")'.dependencies]
# iOS-specific dependencies if needed

[profile.release]
lto = true              # Full link-time optimization — biggest size reduction
codegen-units = 1        # Single codegen unit for maximum optimization
strip = true             # Strip debug symbols from binary
opt-level = "s"          # Optimize for size over speed
panic = "abort"          # Remove unwinding machinery
